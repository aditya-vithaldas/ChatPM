// ---------- build one DOM per scene ----------
function build(s){

  if(s.t==='app'||s.t==='calc') el.insertAdjacentHTML('beforeend',`<div class="arc">${ARC.map((a,i)=>`<div class="seg ${i<s.arc?'done':i===s.arc?'on':''}"><div class="bar"><i style="background-position:-${i*288}px 0"></i></div><div class="lbl">${a}</div></div>`).join('')}</div>`);

    el.insertAdjacentHTML('beforeend',`

        const ps=$$('path',svg), cs=$$('circle',svg); c.path=ps[ps.length-1]; c.halo=cs[cs.length-2]; c.dot=cs[cs.length-1]; c.len=c.path.getTotalLength();
        c.path.style.strokeDasharray=c.len;

    el.insertAdjacentHTML('beforeend',`<div class="lc calc-left">
        <div class="spk"><div class="hd">${MER}<span>Meridian</span></div><div class="tx">I checked the calendar effect too.</div></div>
        <div class="how"><div class="eyebrow">How Meridian got there</div><ol>
          <li><i>1</i><span>Kept October and November</span></li>
          <li><i>2</i><span>Divided revenue by days in each month</span></li>
          <li><i>3</i><span>Compared the daily rate</span></li>
        </ol></div>
        <div class="why"><div class="eyebrow">Why it matters</div><p>Act on the real problem, not the calendar.</p></div>
      </div>
      <div class="calc-vis"><div class="calc-k">like for like</div><div class="hl">${lines(['Change in sales per day'])}</div>
        <div class="bars">${rows.map(([n,v,p,c])=>`<div class="row"><span>${n}</span><div class="track"><div class="fill ${c}" data-w="${p/6*100}"></div></div><b class="${c}">${v}</b></div>`).join('')}</div>
        <div class="axis">November vs October</div>
        <p class="summary">November had 30 days; October had 31. Total sales barely moved per day. Western Europe and Fragrance are the real declines.</p>
        <div class="foot">Calculated from Meridian revenue divided by days in each month.</div>
      </div>`); }
}

// ---------- per-scene animation (lb = beats since content start) ----------
const R={
 story(s,lb,b){ const el=s.el;
   el.style.backgroundPosition=`${50+Math.sin(b*BP*.35)*40}% ${50+Math.cos(b*BP*.3)*40}%`;
   $$('.bars b',el).forEach((x,i)=>x.style.width=(i===(s.b0?1:0)?clamp((lb+0.4)/(s.b1-s.b0))*100:(s.b0&&i===0?100:0))+'%');
   const av=$('.who .av',el), e=pop(lb/1.2); av.style.transform=`scale(${e})`; av.style.opacity=clamp(lb/0.4);
   rise($('.nm',el),lb,0.3,16); rise($('.kick',el),lb,0.8,24);
   revealLines($('.q',el),lb,1.3);
   popIn($('.bub',el),lb,s.bubAt);
   // illustration.md §5: rises in, breathes, blinks, gestures while asking
   const il=$('.illo',el), ie=glide((lb-0.2)/1.6);
   il.style.transform=`translateY(${(1-ie)*90 + Math.sin(b*BP*1.6)*3}px) scale(${1+0.006*Math.sin(b*BP*1.1)})`; il.style.transformOrigin='50% 100%'; il.style.opacity=clamp(ie*1.5);
   const sb=$('.sbub',il), pe=pop((lb-1.8)/1.1); sb.style.transformOrigin='90% 100%'; sb.style.transform=`scale(${pe})`; sb.style.opacity=clamp((lb-1.8)/0.4);
 },
 gc(s,lb,b){ const el=s.el;
   el.style.backgroundPosition=`${50+Math.sin(b*BP*.35)*40}% ${50+Math.cos(b*BP*.3)*40}%`;
   rise($('.kicker',el),lb,0,28); const e=revealLines($('.title',el),lb,0.3);
   rise($('.sub',el),lb,e+0.3); rise($('.url',el),lb,e+1.1); rise($('.foot',el),lb,e+1.8,12);
 },
 app(s,lb,b){ const el=s.el, H=s.H||900;
   animateSig(el,lb);
   const on=$('.arc .seg.on .bar i',el); if(on) on.style.width=clamp((lb+0.4)/1.6)*100+'%';
   $$('.arc .seg.done .bar i',el).forEach(i=>i.style.width='100%');
   const L=s.L||0, seq=s.load?[...s.load.map((f,i)=>[L+[0,.5,1,1.25,1.5,1.75][i],f,0.2]),[L+2,s.done,0.45]]:[[-99,s.done,0.01]];
   let k=-1; seq.forEach(([bb],i)=>{if(lb>=bb) k=i;});
   const A=$('img.A',el),B=$('img.B',el), set=(im,src)=>{if(im.getAttribute('src')!==src) im.setAttribute('src',src);};
   if(k<0){set(A,s.prev);B.style.opacity=0;} else {set(A,k>0?seq[k-1][1]:s.prev);set(B,seq[k][1]);B.style.opacity=clamp((lb-seq[k][0])/seq[k][2]);}
   const cam=keyed(s.cam,lb,1.6), S=1144/1600*cam[2], hw=572/S, hh=322/S;
   const cx=clamp(cam[0],hw,1600-hw), cy=clamp(cam[1],hh,H-hh), tx=572-cx*S, ty=322-cy*S;
   $('.world',el).style.transform=`translate(${tx}px,${ty}px) scale(${S})`;
   rise($('.spk',el),lb,0,24);
   const p=typed($('.say',el),s.say,lb,s.type[0],s.type[1]);
   const D=s.D!=null?s.D:L+2;
   $('.caret',el).style.opacity=lb>=D?0:((p<1||Math.floor(lb*2)%2===0)?1:0);
   rise($('.how .eyebrow',el),lb,D+0.2,12);
   $$('.how li',el).forEach((li,i)=>rise(li,lb,D+0.6+i*0.6,18));
   rise($('.why',el),lb,D+0.9+s.how.length*0.6,20);
   if(s.reply) popIn($('.reply',el),lb,s.reply.at);
   let dimOn=0;
   for(const c of s.co){
     if(c.k==='pull'){ const g=glide((lb-c.at)/1.4); dimOn=Math.max(dimOn,g);
       c.dom.style.opacity=lb>=c.at?1:0; c.dom.style.transform=`translate(${c.lift[0]*g}px,${c.lift[1]*g}px) scale(${1+(c.lift[2]-1)*g})`;
       rise(c.cdom,lb,c.at+0.5,16); }
     if(c.k==='ptr'){ const d=pop((lb-c.at)/0.8); c.dot.style.transform=`scale(${d})`; c.dot.style.transformOrigin=`${c.pt[0]}px ${c.pt[1]}px`; c.dot.style.transformBox='view-box';
       c.halo.style.opacity=lb>=c.at?0.35:0;
       if(c.tap){ const u=(lb-c.tap)/1.2; if(u>=0&&u<1){ c.halo.setAttribute('r',14+40*glide(u)); c.halo.style.opacity=1-u; } else c.halo.setAttribute('r',14); }
       c.path.style.strokeDashoffset=c.len*(1-swipe((lb-c.at-0.3)/1.2));
       const tg=glide((lb-c.at-1.1)/1.1); c.tag.style.opacity=clamp(tg*1.4); c.tag.style.transform=`translate(${(1-tg)*-14}px,-50%)`; }
   }
   $('.dim',el).style.opacity=dimOn;
 },
 calc(s,lb){ const el=s.el;
   animateSig(el,lb);
   const on=$('.arc .seg.on .bar i',el); if(on) on.style.width=clamp((lb+0.4)/1.6)*100+'%';
   $$('.arc .seg.done .bar i',el).forEach(i=>i.style.width='100%');
   rise($('.spk',el),lb,0,20);
   rise($('.how .eyebrow',el),lb,0.5,12);
   $$('.how li',el).forEach((li,i)=>rise(li,lb,0.8+i*0.55,18));
   rise($('.why',el),lb,2.4,18);
   rise($('.calc-k',el),lb,0.5,16); const e=revealLines($('.hl',el),lb,0.8);
   $$('.row',el).forEach((r,i)=>{ rise(r,lb,e+0.4+i*0.6,20); const f=$('.fill',r); f.style.width=f.dataset.w+'%'; f.style.transform=`scaleX(${glide((lb-e-0.7-i*0.6)/1.6)})`; });
   rise($('.axis',el),lb,e+2.4,10);
   rise($('.summary',el),lb,e+3.1,16);
   rise($('.foot',el),lb,e+4.0,10);
 },
};
function keyed(keys,b,dur){
  if(b<=keys[0][0]) return keys[0].slice(1);
  for(let i=1;i<keys.length;i++){const k=keys[i],p=keys[i-1];
    if(b<k[0]){const d=Math.min(dur,k[0]-p[0]),s=k[0]-d; if(b<=s) return p.slice(1); const u=swipe((b-s)/d); return p.slice(1).map((v,j)=>v+(k[j+1]-v)*u);} }
  return keys[keys.length-1].slice(1);
}

// ---------- frame: wipes within a beat, depth only at chapter breaks (animation.md §3) ----------
SC.forEach(build);
window.render=function(t){
  const b=t/BP;
  let ci=SC.findIndex(x=>b>=x.b0&&b<x.b1); if(ci<0) ci=SC.length-1;
  const cur=SC[ci], tr=cur.tr||'wipe', dur=T[tr], prev=ci>0&&b<cur.b0+dur?SC[ci-1]:null;
  SC.forEach(s=>{s.el.style.display='none';});
  const show=(s,z)=>{s.el.style.display=s.t==='app'?'block':'flex'; s.el.style.zIndex=z; R[s.t](s,b-s.b0-DELAY[s.tr||'wipe'],b);};
  const u=(b-cur.b0)/dur, bar=document.getElementById('wipebar');
  bar.style.display='none';
  if(prev){ show(prev,1); Object.assign(prev.el.style,{transform:'none',filter:'none',clipPath:'none',boxShadow:'none',opacity:1}); }
  show(cur,2); Object.assign(cur.el.style,{transform:'none',filter:'none',clipPath:'none',opacity:1,boxShadow:'none'});
  if(ci===0){ const e=glide(b/1.8); cur.el.style.transform=`scale(${0.86+0.14*e})`; cur.el.style.filter=b<1.8?`blur(${(1-e)*14}px) brightness(${0.6+0.4*e})`:'none'; cur.el.style.opacity=clamp(b/0.7); }
  else if(tr==='wipe'){
    const x=100*(1-swipe(u)); cur.el.style.clipPath=u<1?`inset(0 0 0 ${x}%)`:'none';
    const fadeU=(b-cur.b0-dur)/0.2;
    if(u<1||fadeU<1){ bar.style.display='block'; bar.style.left=(u<1?x:0)+'%'; bar.style.opacity=u<1?1:1-clamp(fadeU); }
  } else if(prev){
    cur.el.style.zIndex=1; prev.el.style.zIndex=2;
    const e=glide(u); cur.el.style.transform=`scale(${0.86+0.14*e})`; cur.el.style.filter=u<1?`blur(${(1-e)*14}px) brightness(${0.6+0.4*e})`:'none'; cur.el.style.opacity=clamp(u/0.4);
    const x=swipe((b-cur.b0)/1.5); prev.el.style.transform=`translateX(${-1920*x}px) scale(${1-0.03*x})`; prev.el.style.boxShadow='40px 0 80px rgba(0,0,0,.5)';
  }
  document.getElementById('fade').style.opacity=clamp((b-(END-3))/3);
};
window.ready=(async()=>{
  const srcs=new Set(); SC.forEach(s=>{if(s.prev)srcs.add(s.prev); if(s.done)srcs.add(s.done); srcs.add(MAYA.img.ask);srcs.add(MAYA.img.pleased);srcs.add(MAYA.avatar); (s.load||[]).forEach(f=>srcs.add(f));});
  await Promise.all([...srcs].map(src=>{const im=new Image();im.src=src;return im.decode()}));
  await Promise.all(['500 20px PJS','700 20px PJS','800 20px PJS','20px Script','500 20px Mono'].map(f=>document.fonts.load(f)));
})();
